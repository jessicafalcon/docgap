[project]
name = "docgap"
version = "0.0.0"
description = "Rank undocumented warehouse columns by usage and failure, then draft their descriptions."
license = "MIT"
requires-python = ">=3.12,<3.13"
dependencies = [
    "anthropic>=1.11.0",
    "packaging>=26.3",
    "pyarrow>=25.0.1",
    "pydantic>=2.13.5",
    "sqlglot>=30.20.0",
    "typer>=0.27.2",
]

[project.scripts]
docgap = "docgap.cli:app"

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "hypothesis>=6.168.2",
    "pre-commit>=4.6.2",
    "pyarrow-stubs>=20.0.0.20260819",
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "pytest-socket>=0.8.1",
    "pyyaml>=6.0.3",
    "ruff>=0.16.9",
]
warehouse = [
    # Exact pins: the dbt version sets the manifest schema `docgap.manifest` reads (v12),
    # and the adapter sets the type names the contracts compare.
    "dbt-core==1.12.5",
    "dbt-duckdb==1.11.0",
    "duckdb>=1.5.6",
    # Reads the dictionary's code lists into the dbt seeds (loader/code_list_seeds.py).
    "openpyxl>=3.1.5",
]

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[tool.uv]
# The one uv pin: CI's setup-uv reads it. Keep in sync with the uv-lock hook rev in
# .pre-commit-config.yaml.
required-version = "==0.12.5"
# The loader and dbt run in the same environment as the tests, which load the
# CI fixture into DuckDB. Neither is a docgap runtime dependency, so neither enters
# the run's setup (ADR 0006).
default-groups = ["dev", "warehouse"]

[tool.pytest.ini_options]
testpaths = ["tests", "src", "eval", ".claude/hooks", "loader"]
# The hooks and the loader are scripts, not a package; tests import them by module name.
# The root makes `eval.agent` importable: the harness is not part of the docgap package.
pythonpath = [".", ".claude/hooks", "loader"]
# Tests are offline: any socket other than a Unix one fails the test that opens it
# (docgap-tests). A test that needs a local fake server opts in with a marker.
addopts = ["--doctest-modules", "--disable-socket", "--allow-unix-socket"]
strict = true

[tool.ruff]
line-length = 100
# Accepted decision records are never rewritten, and ruff would format their code blocks.
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "RUF", "PT", "PTH", "DTZ", "S"]

[tool.ruff.lint.pycodestyle]
# The formatter targets 100 but can't split string literals or comments; lint
# flags only lines past this ceiling.
max-line-length = 120

[tool.ruff.lint.per-file-ignores]
# Tests build SQL from fixed text to probe the warehouse.
"tests/**" = ["S101", "S608"]

[tool.pyright]
include = ["src", "eval", "tests", ".claude/hooks", "loader"]
strict = ["src", "eval"]
extraPaths = [".claude/hooks", "loader"]
