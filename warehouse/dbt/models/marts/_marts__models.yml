models:
  - name: fct_reimbursements
    description: >-
      Open DAMIR reimbursements, one row per source line of the monthly files.
    config:
      meta:
        owner: data-team
    # Column descriptions are left blank until the baseline docs are drawn by the
    # recorded rule (ADR 0021). `restricted` marks the beneficiary's demographics
    # (age bracket, sex, region of residence); every other column is published
    # open data, so `public`.
    columns:
      - name: FLX_ANN_MOI
        data_type: integer
        config:
          meta:
            sensitivity: public
      - name: ORG_CLE_REG
        data_type: integer
        config:
          meta:
            sensitivity: public
      - name: AGE_BEN_SNDS
        data_type: integer
        config:
          meta:
            sensitivity: restricted
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_age_bracket')
                field: AGE_BEN_SNDS
      - name: BEN_RES_REG
        data_type: integer
        config:
          meta:
            sensitivity: restricted
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_region')
                field: BEN_RES_REG
      - name: BEN_CMU_TOP
        data_type: integer
        config:
          meta:
            sensitivity: public
      - name: BEN_QLT_COD
        data_type: integer
        config:
          meta:
            sensitivity: public
      - name: BEN_SEX_COD
        data_type: integer
        config:
          meta:
            sensitivity: restricted
      - name: DDP_SPE_COD
        data_type: integer
        config:
