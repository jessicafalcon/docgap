# The offline pilot's 12 questions: two in each of the 40's six categories, under the
# same rules (EVAL_PROTOCOL.md, "Questions"; ADR 0024). Gold SQL is Snowflake SQL over
# ANALYTICS.MARTS; offline, the harness transpiles it to DuckDB (ADR 0014). Spend sums
# the pre-filtered `FLT_` measures; a processing month is `FLX_ANN_MOI`, a care month
# `SOI_ANN` and `SOI_MOI`, and the one care-month total is January 2025's (ADR 0012).
# Each question names its measure, declares every swap of `eval/questions.py` that
# changes its result, and settles at least two of the month, the region and the
# provider in its text: pass 2's level 1 (ADR 0033).
# Gold results are the sample's, from `uv run python -m eval.questions gold`, stored
# typed in eval/pilot_gold/. None of the 40 repeats an ID or a text from here.
questions:
  - id: P01
    category: pharmacy_dental
    text: >-
      What was Health Insurance's statutory share reimbursed at pharmacies for
      beneficiaries residing in Ile-de-France, in claims processed in February 2025?
    ordered: false
    accept: [rem_by_type]
    rule_out:
      care_month: processed in
      prescriber: at pharmacies
      region_ete_reg_cod: residing in
      region_etp_reg_cod: residing in
      region_exe_ins_reg: residing in
      region_org_cle_reg: residing in
      region_pre_ins_reg: residing in
      rem_total: statutory share
    gold_sql: |
      SELECT SUM(FLT_REM_MNT)
      FROM ANALYTICS.MARTS.FCT_REIMBURSEMENTS
      WHERE PSE_ACT_SNDS = 50
        AND BEN_RES_REG = 11
        AND FLX_ANN_MOI = 202502

  - id: P02
    category: pharmacy_dental
    text: >-
      For care whose executing provider's activity is recorded as dental surgery,
      what was the amount charged, before any reimbursement, in each region where the
      executing professional practises, the unknown region included, in claims
      processed in January 2025? Return each region's name and the amount.
    ordered: false
    accept: [pai_by_type]
    rule_out:
      care_month: processed in
      prescriber: executing provider
      region_ben_res_reg: executing professional practises
      region_ete_reg_cod: executing professional practises
      region_etp_reg_cod: executing professional practises
      region_org_cle_reg: executing professional practises
      region_pre_ins_reg: executing professional practises
    gold_sql: |
      SELECT r.BEN_RES_REG_LIB, SUM(f.FLT_PAI_MNT)
      FROM ANALYTICS.MARTS.FCT_REIMBURSEMENTS AS f
      JOIN ANALYTICS.MARTS.DIM_REGION AS r ON r.BEN_RES_REG = f.EXE_INS_REG
      WHERE f.PSE_ACT_SNDS = 19
        AND f.FLX_ANN_MOI = 202501
      GROUP BY r.BEN_RES_REG_LIB

  - id: P03
    category: region
    text: >-
      Leaving out an unknown region, which three regions where the prescribing
      professional practises had the highest statutory share reimbursed by Health
      Insurance, in claims processed in March 2025? Return each region's name and the
      amount, highest first.
    ordered: true
    accept: [rem_by_type]
    rule_out:
      care_month: processed in
      region_ben_res_reg: prescribing professional practises
      region_ete_reg_cod: prescribing professional practises
      region_etp_reg_cod: prescribing professional practises
      region_exe_ins_reg: prescribing professional practises
      region_org_cle_reg: prescribing professional practises
      rem_total: statutory share
    gold_sql: |
      SELECT r.BEN_RES_REG_LIB, SUM(f.FLT_REM_MNT) AS reimbursed
      FROM ANALYTICS.MARTS.FCT_REIMBURSEMENTS AS f
      JOIN ANALYTICS.MARTS.DIM_REGION AS r ON r.BEN_RES_REG = f.PRE_INS_REG
      WHERE f.FLX_ANN_MOI = 202503
        AND f.PRE_INS_REG <> 99
      GROUP BY r.BEN_RES_REG_LIB
      ORDER BY reimbursed DESC
      LIMIT 3

  - id: P04
    category: region
    text: >-
      For each region of the Health Insurance fund that settled the claims, unknown
      included, what was Health Insurance's statutory share reimbursed for care
      delivered in January 2025, whatever month the claims were processed in? Return
      each region's name and the amount.
    ordered: false
    accept: [rem_by_type]
    rule_out:
      processing_month: care delivered in
      region_ben_res_reg: fund that settled the claims
      region_ete_reg_cod: fund that settled the claims
      region_etp_reg_cod: fund that settled the claims
      region_exe_ins_reg: fund that settled the claims
      region_pre_ins_reg: fund that settled the claims
      rem_total: statutory share
    gold_sql: |
      SELECT r.BEN_RES_REG_LIB, SUM(f.FLT_REM_MNT)
      FROM ANALYTICS.MARTS.FCT_REIMBURSEMENTS AS f
      JOIN ANALYTICS.MARTS.DIM_REGION AS r ON r.BEN_RES_REG = f.ORG_CLE_REG
      WHERE f.SOI_ANN = '2025'
        AND f.SOI_MOI = '01'
      GROUP BY r.BEN_RES_REG_LIB

  - id: P05
    category: age_bracket
    text: >-
      What quantity of acts was performed for beneficiaries aged 80 and over, on the
      prescription of a professional practising in Ile-de-France, in claims processed
      in March 2025?
    ordered: false
    accept: [act_by_type]
    rule_out:
      care_month: processed in
      region_ben_res_reg: prescription of a professional practising in
      region_ete_reg_cod: prescription of a professional practising in
      region_etp_reg_cod: prescription of a professional practising in
      region_exe_ins_reg: prescription of a professional practising in
      region_org_cle_reg: prescription of a professional practising in
    gold_sql: |
      SELECT SUM(FLT_ACT_QTE)
      FROM ANALYTICS.MARTS.FCT_REIMBURSEMENTS
      WHERE AGE_BEN_SNDS = 80
        AND PRE_INS_REG = 11
        AND FLX_ANN_MOI = 202503

  - id: P06
    category: age_bracket
    text: >-
      Leaving out beneficiaries of unknown age, what were the fees billed above the
      agreed rate for beneficiaries residing in Auvergne-Rhône-Alpes, by age bracket,
      for care delivered in January 2025, whatever month the claims were processed
      in? Return each bracket's name and the amount.
    ordered: false
    accept: [dep_by_type]
    rule_out:
      processing_month: care delivered in
      region_ete_reg_cod: residing in
      region_etp_reg_cod: residing in
      region_exe_ins_reg: residing in
      region_org_cle_reg: residing in
      region_pre_ins_reg: residing in
    gold_sql: |
      SELECT a.AGE_BEN_SNDS_LIB, SUM(f.FLT_DEP_MNT)
      FROM ANALYTICS.MARTS.FCT_REIMBURSEMENTS AS f
      JOIN ANALYTICS.MARTS.DIM_AGE_BRACKET AS a ON a.AGE_BEN_SNDS = f.AGE_BEN_SNDS
      WHERE f.AGE_BEN_SNDS <> 99
        AND f.BEN_RES_REG = 84
        AND f.SOI_ANN = '2025'
        AND f.SOI_MOI = '01'
      GROUP BY a.AGE_BEN_SNDS_LIB

  - id: P07
    category: provider_type
    text: >-
      Leaving out care whose prescribing provider's activity is not recorded, which
      three prescribing provider activities had the highest amount charged, before any
      reimbursement, in claims processed in February 2025? Return each activity's
      name, highest first.
    ordered: true
    rule_out:
      care_month: processed in
      executor: prescribing provider
    gold_sql: |
      SELECT p.PSE_ACT_SNDS_LIB
      FROM ANALYTICS.MARTS.FCT_REIMBURSEMENTS AS f
      JOIN ANALYTICS.MARTS.DIM_PROVIDER_ACTIVITY AS p ON p.PSE_ACT_SNDS = f.PSP_ACT_SNDS
      WHERE f.PSP_ACT_SNDS <> 0
        AND f.FLX_ANN_MOI = 202502
      GROUP BY p.PSE_ACT_SNDS_LIB
      ORDER BY SUM(f.FLT_PAI_MNT) DESC
      LIMIT 3

  - id: P08
    category: provider_type
    text: >-
      What quantity of acts did nurses perform for beneficiaries residing in
      Bretagne, in claims processed in February 2025?
    ordered: false
    accept: [act_by_type]
    rule_out:
      care_month: processed in
      prescriber: nurses perform
      region_ete_reg_cod: residing in
      region_etp_reg_cod: residing in
      region_exe_ins_reg: residing in
      region_org_cle_reg: residing in
      region_pre_ins_reg: residing in
    gold_sql: |
      SELECT SUM(FLT_ACT_QTE)
      FROM ANALYTICS.MARTS.FCT_REIMBURSEMENTS
      WHERE PSE_ACT_SNDS = 24
        AND BEN_RES_REG = 53
        AND FLX_ANN_MOI = 202502

  - id: P09
    category: processing_month
    text: >-
      By how much did the amount charged, before any reimbursement, for care by
      executing professionals practising in Grand Est change from claims processed in
      January 2025 to claims processed in February 2025? Return February's total
      minus January's.
    ordered: false
    accept: [pai_by_type]
    rule_out:
      care_month: processed in
      region_ben_res_reg: executing professionals practising in
      region_ete_reg_cod: executing professionals practising in
      region_etp_reg_cod: executing professionals practising in
      region_org_cle_reg: executing professionals practising in
      region_pre_ins_reg: executing professionals practising in
    gold_sql: |
      SELECT SUM(IFF(FLX_ANN_MOI = 202502, FLT_PAI_MNT, 0))
        - SUM(IFF(FLX_ANN_MOI = 202501, FLT_PAI_MNT, 0))
      FROM ANALYTICS.MARTS.FCT_REIMBURSEMENTS
      WHERE EXE_INS_REG = 44

  - id: P10
    category: processing_month
    text: >-
      For each processing month, what was Health Insurance's statutory share
      reimbursed at pharmacies, and how much did it change from the month before?
      Return the month as a number in YYYYMM form, the amount and the change (empty
      for the first month), in month order.
    ordered: true
    accept: [rem_by_type]
    rule_out:
      care_month: processing month
      prescriber: at pharmacies
      rem_total: statutory share
    gold_sql: |
      SELECT
        FLX_ANN_MOI,
        SUM(FLT_REM_MNT),
        SUM(FLT_REM_MNT) - LAG(SUM(FLT_REM_MNT)) OVER (ORDER BY FLX_ANN_MOI)
      FROM ANALYTICS.MARTS.FCT_REIMBURSEMENTS
      WHERE PSE_ACT_SNDS = 50
      GROUP BY FLX_ANN_MOI
      ORDER BY FLX_ANN_MOI

  - id: P11
    category: care_vs_processing
    text: >-
      What was Health Insurance's statutory share reimbursed for care delivered in
      January 2025, whatever month the claims were processed in, on the prescription
      of a professional practising in Pays de la Loire?
    ordered: false
    accept: [rem_by_type]
    rule_out:
      processing_month: care delivered in
      region_ben_res_reg: prescription of a professional practising in
      region_ete_reg_cod: prescription of a professional practising in
      region_etp_reg_cod: prescription of a professional practising in
      region_exe_ins_reg: prescription of a professional practising in
      region_org_cle_reg: prescription of a professional practising in
      rem_total: statutory share
    gold_sql: |
      SELECT SUM(FLT_REM_MNT)
      FROM ANALYTICS.MARTS.FCT_REIMBURSEMENTS
      WHERE PRE_INS_REG = 52
        AND SOI_ANN = '2025'
        AND SOI_MOI = '01'

  - id: P12
    category: care_vs_processing
    text: >-
      Of the amount charged, before any reimbursement, for care delivered in January
      2025 whose executing provider's activity is recorded as dental surgery, how much
      was in claims processed in each processing month? Return the processing month as
      a number in YYYYMM form and the amount, in month order.
    ordered: true
    accept: [pai_by_type]
    rule_out:
      care_month: processing month
      prescriber: executing provider
      processing_month: care delivered in
    gold_sql: |
      SELECT FLX_ANN_MOI, SUM(FLT_PAI_MNT)
      FROM ANALYTICS.MARTS.FCT_REIMBURSEMENTS
      WHERE PSE_ACT_SNDS = 19
        AND SOI_ANN = '2025'
        AND SOI_MOI = '01'
      GROUP BY FLX_ANN_MOI
      ORDER BY FLX_ANN_MOI
