# The evaluation's 40 questions, Q01 to Q40 in writing order, under the protocol's
# "Questions" rules (EVAL_PROTOCOL.md). Gold SQL is Snowflake SQL over ANALYTICS.MARTS;
# offline, the harness transpiles it to DuckDB (ADR 0014). A processing month is
# `FLX_ANN_MOI`, a care month `SOI_ANN` and `SOI_MOI`, and a care-month total summed
# across processing months is January 2025's (ADR 0012).
# Half sum a measure with no trap, `PRS_REM_MNT` or `PRS_REM_BSE` unfiltered, the text
# ruling out the filtered readings; half a pre-filtered `FLT_` one, at most 6 on any
# one. A question's half is read from its gold SQL (ADR 0036). No gold query reads
# the aggregate (ADR 0038).
# Each question names its measure, declares every swap of `eval/questions.py` that
# changes its result, settles at least two of the month, the region and the provider
# in its text, and names its main `trap`, a swap its text rules out and that changes
# its gold result on the sample (ADR 0038). Each trap is the main one of 4 questions.
# Gold results are the sample's, from `uv run python -m eval.questions gold`, stored
# typed in eval/gold/. No ID or text repeats a pilot question's.
questions:
  - id: Q01
    category: pharmacy_dental
    trap: prescriber
    text: >-
      What did Health Insurance reimburse at pharmacies, the statutory and
      supplementary shares together, for beneficiaries aged 80 and over, in claims
      processed in January 2025?
    ordered: false
    rule_out:
      care_month: processed in
      prescriber: at pharmacies
      rem_statutory: supplementary shares
      rem_statutory_by_type: supplementary shares
    gold_sql: |
      SELECT SUM(PRS_REM_MNT)
      FROM ANALYTICS.MARTS.FCT_REIMBURSEMENTS
      WHERE PSE_ACT_SNDS = 50
        AND AGE_BEN_SNDS = 80
        AND FLX_ANN_MOI = 202501

  - id: Q02
    category: pharmacy_dental
    trap: region_ete_reg_cod
    text: >-
      What quantity of acts was performed at pharmacies whose executing professional
      practises in Normandie, in claims processed in March 2025?
    ordered: false
    accept: [act_by_type]
    rule_out:
      care_month: processed in
      prescriber: at pharmacies
      region_ben_res_reg: executing professional practises in
      region_ete_reg_cod: executing professional practises in
      region_etp_reg_cod: executing professional practises in
      region_org_cle_reg: executing professional practises in
      region_pre_ins_reg: executing professional practises in
    gold_sql: |
      SELECT SUM(FLT_ACT_QTE)
      FROM ANALYTICS.MARTS.FCT_REIMBURSEMENTS
      WHERE PSE_ACT_SNDS = 50
        AND EXE_INS_REG = 28
        AND FLX_ANN_MOI = 202503

