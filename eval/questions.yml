    rule_out:
      bse_by_type: every share included
      prescriber: at pharmacies
      processing_month: care delivered in
      region_ben_res_reg: prescribing professional practises
      region_ete_reg_cod: prescribing professional practises
      region_etp_reg_cod: prescribing professional practises
      region_exe_ins_reg: prescribing professional practises
