  - id: Q08
    category: provider_type
    trap: prescriber
    text: >-
      Leaving out care whose executing provider's activity is not recorded, which
      three executing provider activities had the highest statutory share reimbursed
      by Health Insurance for beneficiaries residing in Languedoc-Roussillon-Midi-Pyrénées,
      in claims processed in January 2025? Return each activity's name and the
      amount, highest first.
    ordered: true
    accept: [rem_by_type]
    rule_out:
      care_month: processed in
      prescriber: executing provider
      region_ete_reg_cod: residing in
      region_etp_reg_cod: residing in
      region_exe_ins_reg: residing in
      region_org_cle_reg: residing in
      region_pre_ins_reg: residing in
      rem_total: statutory share
    gold_sql: |
      SELECT p.PSE_ACT_SNDS_LIB, SUM(f.FLT_REM_MNT) AS reimbursed
      FROM ANALYTICS.MARTS.FCT_REIMBURSEMENTS AS f
      JOIN ANALYTICS.MARTS.DIM_PROVIDER_ACTIVITY AS p ON p.PSE_ACT_SNDS = f.PSE_ACT_SNDS
      WHERE f.PSE_ACT_SNDS <> 0
        AND f.BEN_RES_REG = 76
        AND f.FLX_ANN_MOI = 202501
      GROUP BY p.PSE_ACT_SNDS_LIB
      ORDER BY reimbursed DESC
      LIMIT 3

