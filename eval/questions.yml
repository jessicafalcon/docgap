  - id: Q30
    category: processing_month
    trap: care_month
    text: >-
      For each processing month, what quantity of acts did nurses perform for
      beneficiaries aged 80 and over, and how much did it change from the month
      before? Return the month as a number in YYYYMM form, the quantity and the
      change (empty for the first month), in month order.
    ordered: true
    accept: [act_by_type]
    rule_out:
      care_month: processing month
      prescriber: nurses perform
    gold_sql: |
      SELECT
        FLX_ANN_MOI,
        SUM(FLT_ACT_QTE),
        SUM(FLT_ACT_QTE) - LAG(SUM(FLT_ACT_QTE)) OVER (ORDER BY FLX_ANN_MOI)
      FROM ANALYTICS.MARTS.FCT_REIMBURSEMENTS
      WHERE PSE_ACT_SNDS = 24
        AND AGE_BEN_SNDS = 80
      GROUP BY FLX_ANN_MOI
      ORDER BY FLX_ANN_MOI

