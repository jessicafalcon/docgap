# Runs locally before each commit and in CI over every file. Ruff and pyright run from
# the project venv (`uv run --frozen`) so their versions come from uv.lock and pyright
# resolves the project's own dependencies.
# commit-msg too, so a plain `pre-commit install` also installs the message check. Hooks
# run only at pre-commit unless they name another stage.
default_install_hook_types: [pre-commit, commit-msg]
default_stages: [pre-commit]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
        # --enforce-all so CI checks every tracked file, not only newly staged ones.
        args: ["--maxkb=5000", "--enforce-all"]
      - id: check-merge-conflict
      - id: check-toml
      - id: check-yaml
      - id: end-of-file-fixer
      - id: trailing-whitespace

  # Keep in sync with `required-version` in pyproject.toml.
  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: 0.12.5
    hooks:
      - id: uv-lock

  # The system binary, so CI checks it against a pinned checksum instead of building it.
  # Scans staged changes only, so CI skips it and scans the full history instead.
  # Keep the rev in sync with the gitleaks version in .github/workflows/ci.yml.
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks-system
        # Upstream omits this for the system variant only; the scan reads git, not files.
        pass_filenames: false

  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run --frozen ruff check --fix
        language: system
        types_or: [python, pyi]
      - id: ruff-format
        name: ruff format
        entry: uv run --frozen ruff format
        language: system
        types_or: [python, pyi]
      - id: pyright
        name: pyright
        # --project: a pyrightconfig.json in a parent directory would otherwise win.
        entry: uv run --frozen pyright --project pyproject.toml
        language: system
        types_or: [python, pyi]
        pass_filenames: false
      # Same rules as the Claude Code PostToolUse hook (docgap-correctness §1).
      - id: determinism-guard
        name: determinism guard
        entry: uv run --frozen python .claude/hooks/determinism_guard.py
        language: system
        files: ^src/docgap/.*\.py$
      # Same term list as the Claude Code PreToolUse hook: staged files at pre-commit,
      # the message at commit-msg. No `.claude/private-terms.local` (CI), no check.
      - id: private-terms
        name: private terms
        entry: uv run --frozen python .claude/hooks/private_terms_guard.py
        language: system
        stages: [pre-commit, commit-msg]
