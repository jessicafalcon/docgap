# docgap configuration: every value the pipeline reads. The code has no defaults,
# so a missing key fails loading instead of falling back. Every key sits in a
# section, and each section is hashed on its own into the run's setup (ADR 0007).
# A later step adds the keys it reads, under a section named for what reads them.

[snapshot]
# Query history exported per run: the week that ends at the run's as-of date.
history_window_days = 7
# Gates on the snapshot, each failing the stage when crossed, so an empty window or
# an export sqlglot can't read never yields an all-zero ranking. The parse rate is
# the share of queries reaching the parser that sqlglot normalizes.
min_rows_kept = 1
min_parse_rate = 0.9

[actors]
# Role → actor class. Only these roles' queries count as usage, so loads, dbt
# builds and docgap's own reads never do. A human role joins when the brief's open
# decision on where "people" traffic comes from is settled.
AGENT_READER = "agent"

[manifest]
# The schema agents read (the governance table's `AGENT_READER` grant). Its dbt
# models are the mart columns that are resolved, counted and ranked; any other
# relation is unmanaged.
mart_database = "ANALYTICS"
mart_schema = "MARTS"

[rank]
# score = ln(1 + u) × (1 + w·r), set by the evaluation protocol.
w = 1

[evidence]
# k: a value carried by fewer fact rows is suppressed from profiles (ADR 0003).
min_value_count = 11

[gate]
# Draft-gate bands on the "fully supported" probability: at least `ready_min` is
# ready, at least `confirm_min` needs the owner to confirm, below it is flagged.
ready_min = 0.8
confirm_min = 0.5

[seeds]
# Arbitrary values, set before any question existed.
split = 1
random_arm = 2
# Picks the baseline's documented half of the mart columns (ADRs 0010, 0021).
baseline_docs = 3

[agent]
# The test agent's `run_sql` tool, per call. The harness runs the final answer under
# the same timeout and fetches one row past the cap, so a longer result fails.
statement_timeout_seconds = 60
row_cap = 200
# Tool calls before the final answer, all three tools counted (the protocol's 8).
max_tool_calls = 8
# Output tokens per model call, thinking included: room for Opus 5.5's adaptive
# thinking, and the non-streaming size the SDK accepts without a warning.
max_tokens = 16000
# Attempts at a run whose model call failed after the retries; then it is `error`.
run_attempts = 3

[llm]
# Per model call, at every call site. The SDK retries a connection error, a timeout,
# 408, 409, 429 and 5xx, with backoff honouring Retry-After, `max_retries` times. The
# timeout is the SDK's own estimate for the largest reply a call site asks for without
# streaming: 3,600 s × 16,000 tokens (the agent's `max_tokens`) / 128,000 = 450 s.
timeout_seconds = 450
max_retries = 2
# Per process, over live calls only: a cache hit costs nothing, and a resumed run
# starts again from zero. A call that would start with either limit reached is refused,
# and the run stops. A failed call counts as a call but adds no spend, since the API
# reports no usage for it. One pilot pass makes at most 2 models × 72 runs × 9 calls
# = 1,296 calls, about $30 at the rates the brief estimates; the rest of the call limit
# is room for calls that fail and are made again.
max_calls = 1400
max_spend_usd = 45

# USD per million tokens, from the provider's price list (checked 2026-10-01). Cache
# reads are charged at the input rate and cache writes at twice it, bounds that never
# undercount; the agent sets no cache breakpoints. Every model a call site or the
# pilot names needs a price.
[llm.prices]
"claude-haiku-4-5-20251001" = { input = 1.0, output = 5.0 }
"claude-opus-5-5" = { input = 4.0, output = 20.0 }

[pilot]
# The two candidates for the agent model, pinned by ID: Haiku 4.5 by its dated ID,
# since its alias can move; Opus 5.5 has only the one. The pilot picks one by the
# protocol's rule, and it becomes `[call_sites.agent]` at the tag.
models = ["claude-haiku-4-5-20251001", "claude-opus-5-5"]

# Model call sites. Every call runs at the model's default sampling, so `sampling`
# lists the settings sent, and none are. The agent's call site is added when the
# Phase 3 pilot picks its model.
[call_sites.attribution]
model = "claude-opus-5-5"
sampling = {}

[call_sites.drafter]
model = "claude-opus-5-5"
sampling = {}

[call_sites.gate]
model = "claude-opus-5-5"
sampling = {}
